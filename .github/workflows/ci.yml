name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-push:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Test
        run: |
          docker buildx bake claude-test \
            --set "claude-test.cache-from=type=gha" \
            --set "claude-test.cache-to=type=gha,mode=max"

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name == 'push'
        run: |
          GIT_SHA=${{ github.sha }} docker buildx bake --push \
            --set "*.cache-from=type=gha" \
            --set "*.cache-to=type=gha,mode=max"

      - name: Validate kits
        # The docker/sandbox-kit:3 build frontend validates the descriptor and
        # fails on any schema error. No sbx install or Docker sign-in needed.
        run: |
          docker buildx build ./claude-kit -f ./claude-kit/spec.yaml --output type=cacheonly
          docker buildx build ./pi-kit -f ./pi-kit/spec.yaml --output type=cacheonly

      - name: Push kit
        if: github.event_name == 'push'
        run: |
          for ref in latest ${{ github.sha }}; do
            docker buildx build ./claude-kit -f ./claude-kit/spec.yaml --platform linux/amd64,linux/arm64 --push -t ghcr.io/thenickfish/docker-ai-sbx-claude-kit:$ref
            docker buildx build ./pi-kit -f ./pi-kit/spec.yaml --platform linux/amd64,linux/arm64 --push -t ghcr.io/thenickfish/docker-ai-sbx-pi-kit:$ref
          done
