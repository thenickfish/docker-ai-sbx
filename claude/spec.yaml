# https://docs.docker.com/ai/sandboxes/customize/kits/
schemaVersion: "1"
kind: mixin
name: thenickfish-claude
commands:
  startup:
    - command:
        - sh
        - -c
        - |
          # sbx's startup dispatcher runs with a minimal PATH that excludes
          # /home/agent/.local/bin, so `rtk` isn't found without this — see
          # the base "claude" kit's own MCP registration script, which
          # re-exports PATH before calling `claude` for the same reason.
          export PATH="/home/agent/.local/bin:$PATH"
          mkdir -p /home/agent/.claude
          # skipDangerousModePermissionPrompt: intentional — sandbox is an isolated environment
          cat > /home/agent/.claude/settings.json <<'JSON'
          {
            "hooks": {
              "PreToolUse": [
                {
                  "matcher": "Bash",
                  "hooks": [{"type": "command", "command": "rtk hook claude"}]
                }
              ]
            },
            "skipDangerousModePermissionPrompt": true,
            "enabledPlugins": {
              "caveman@caveman": true
            },
            "statusLine": {
              "type": "command",
              "command": "/home/agent/.claude/statusline.sh",
              "padding": 0
            }
          }
          JSON
          cat > /home/agent/.claude/statusline.sh <<'SH'
          #!/bin/bash
          input=$(cat)

          model=$(echo "$input" | jq -r '.model.display_name')
          dir=$(echo "$input" | jq -r '.workspace.current_dir')
          dir_name=$(basename "$dir")

          branch=""
          if git -C "$dir" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            b=$(git -C "$dir" branch --show-current 2>/dev/null)
            if [ -n "$b" ]; then
              dirty=""
              [ -n "$(git -C "$dir" status --porcelain 2>/dev/null)" ] && dirty="*"
              branch=" ($b$dirty)"
            fi
          fi

          cost=$(echo "$input" | jq -r '.cost.total_cost_usd // empty')
          cost_str=""
          [ -n "$cost" ] && cost_str=$(awk -v c="$cost" 'BEGIN{printf " $%.4f", c}')

          # Context-window usage % isn't in the stdin payload — read it off
          # the last transcript line that carries a usage block. Claude Code
          # resends the full transcript each turn, so "how full is my
          # context" is that turn's *input*-side total (input + cache write
          # + cache read); output_tokens is new text from this turn, not yet
          # part of next turn's input. `tail -c` bounds the read to the tail
          # of a (possibly huge) transcript for speed, and the following
          # `tail -n +2` drops whatever partial line that byte cut lands in,
          # so jq only ever sees whole JSON lines.
          transcript=$(echo "$input" | jq -r '.transcript_path // empty')
          context_str=""
          if [ -n "$transcript" ] && [ -f "$transcript" ]; then
            ctx=$(tail -c 50000 "$transcript" 2>/dev/null | tail -n +2 | jq -rs '
              map(select(.message.usage != null) | .message.usage) | last |
              if . then ((.input_tokens // 0) + (.cache_creation_input_tokens // 0) + (.cache_read_input_tokens // 0)) else empty end
            ' 2>/dev/null)
            if [ -n "$ctx" ] && [ "$ctx" != "null" ]; then
              # 200k is Claude Code's standard context window; hardcoded
              # since the statusline payload doesn't expose the active limit.
              context_str=$(awk -v n="$ctx" 'BEGIN{printf " %.0f%% ctx", (n/200000)*100}')
            fi
          fi

          printf '\033[2m[%s]\033[0m %s%s%s%s\n' "$model" "$dir_name" "$branch" "$cost_str" "$context_str"
          SH
          chmod +x /home/agent/.claude/statusline.sh
          cat > /home/agent/.claude/CLAUDE.md <<'MD'
          On session start: activate /caveman full immediately

          ## Sandbox environment
          This session runs inside an isolated Docker sandbox (Linux), not the user's host machine.
          - Network access is restricted to an allowlist. If you need a domain that's blocked, ask the user for it rather than working around it — the sandbox can grant one-time network approval.
          - The workspace is bind-mounted from the host, but the sandbox is a different OS/architecture than the host may be (e.g. Linux sandbox, macOS/ARM host). Don't run commands that write platform-specific build artifacts into the shared workspace (`terraform init` providers, `node_modules` with native addons, compiled binaries, venvs) without flagging it first — they'll be built for the sandbox's platform and can silently break when the host later reuses that same directory.
          MD
          rtk init -g --auto-patch
      user: "1000"
      description: Write claude settings.json (rtk hooks + caveman plugin) and CLAUDE.md, init rtk globally
