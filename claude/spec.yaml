# https://docs.docker.com/ai/sandboxes/customize/kits/
schemaVersion: "1"
kind: mixin
name: thenickfish-claude
commands:
  startup:
    - command:
        - sh
        - -c
        - |
          # sbx's startup dispatcher runs with a minimal PATH that excludes
          # /home/agent/.local/bin, so `rtk` isn't found without this — see
          # the base "claude" kit's own MCP registration script, which
          # re-exports PATH before calling `claude` for the same reason.
          export PATH="/home/agent/.local/bin:$PATH"
          mkdir -p /home/agent/.claude
          # skipDangerousModePermissionPrompt: intentional — sandbox is an isolated environment
          cat > /home/agent/.claude/settings.json <<'JSON'
          {
            "hooks": {
              "PreToolUse": [
                {
                  "matcher": "Bash",
                  "hooks": [{"type": "command", "command": "rtk hook claude"}]
                }
              ]
            },
            "skipDangerousModePermissionPrompt": true,
            "enabledPlugins": {
              "caveman@caveman": true
            },
            "statusLine": {
              "type": "command",
              "command": "/home/agent/.claude/statusline/statusline.sh"
            }
          }
          JSON
          cat > /home/agent/.claude/CLAUDE.md <<'MD'
          On session start: activate /caveman full immediately

          ## Sandbox environment
          This session runs inside an isolated Docker sandbox (Linux), not the user's host machine.
          - Network access is restricted to an allowlist. If you need a domain that's blocked, ask the user for it rather than working around it — the sandbox can grant one-time network approval.
          - The workspace is bind-mounted from the host, but the sandbox is a different OS/architecture than the host may be (e.g. Linux sandbox, macOS/ARM host). Don't run commands that write platform-specific build artifacts into the shared workspace (`terraform init` providers, `node_modules` with native addons, compiled binaries, venvs) without flagging it first — they'll be built for the sandbox's platform and can silently break when the host later reuses that same directory.
          MD
          rtk init -g --auto-patch
          # GH_TOKEN is set to a proxy-managed sentinel by the sbx platform.
          # It intercepts git HTTPS ops at the MITM layer (unaffected by this unset).
          # Unsetting it lets gh CLI fall back to GITHUB_TOKEN, which is injected
          # via `sbx secret set-custom --host api.github.com --env GITHUB_TOKEN`.
          echo 'unset GH_TOKEN' >> /etc/sandbox-persistent.sh
      user: "1000"
      description: Write claude settings.json (rtk hooks + caveman plugin) and CLAUDE.md, init rtk globally
